[project]
name = "devin-telegram-bot"
version = "1.0.0"
description = "Telegram bot for managing Devin AI sessions with multi-key rotation and whitelist"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
